eureka.client.serviceUrl.defaultZone=http://localhost:7090/eureka

# Give preference to local setting if configured
spring.cloud.config.allow-override=true
spring.cloud.config.override-none=true

#Not implemented the exact requirement(If response delayed for 3 seconds, then fallback)

resilience4j.circuitbreaker.instances.myCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true


