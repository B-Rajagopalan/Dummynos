
server.port=8888

# Active profile: native (uses local file system instead of Git)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:../GitFiles

# Fallback path if using git profile locally, updated to relative path
# spring.cloud.config.server.git.uri=file:../GitFiles
spring.cloud.config.server.git.default-label=master


#To register the config server with Eureka 
eureka.client.serviceUrl.defaultZone=http://localhost:7090/eureka/
