#Comment these configs if you use Config Server 
#since application name is used to fetch properties from ConfigServer via Eureka Server

#server.port=8082
#eureka.client.serviceUrl.defaultZone=http://localhost:7090/eureka

#Not implemented the exact requirement(If response delayed for 3 seconds, then fallback)

resilience4j.circuitbreaker.instances.myCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.myCircuitBreaker.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.myCircuitBreaker.waitDurationInOpenState=3s
resilience4j.circuitbreaker.instances.myCircuitBreaker.slidingWindowType=COUNT_BASED

# Rate limit (testing purpose)
resilience4j.ratelimiter.instances.myRateLimiter.limitForPeriod=10
resilience4j.ratelimiter.instances.myRateLimiter.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.myRateLimiter.timeoutDuration=500ms

/*
limitForPeriod -> Max number of calls allowed in one refresh period
limitRefreshPeriod -> Duration of each period (resets the count)
timeoutDuration -> How long a blocked call waits for a permit before failing
*/


#Comment this config if you don't use Config Server
management.endpoints.web.exposure.include=refresh