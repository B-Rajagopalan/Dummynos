<div class="order-page">
  <div class="container animate-fade-in">
    <div class="form-wrapper glass">
      <h2 class="text-gradient">Create Your Order</h2>
      <p class="subtitle">Customize your perfect pizza</p>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="pizzaName">Pizza Name</label>
          <input 
            type="text" 
            id="pizzaName" 
            formControlName="pizzaName" 
            class="form-control" 
            list="pizzaSuggestions"
            placeholder="e.g. Margherita"
            [class.is-invalid]="orderForm.get('pizzaName')?.invalid && orderForm.get('pizzaName')?.touched">
          <datalist id="pizzaSuggestions">
            <option *ngFor="let pizza of famousPizzas" [value]="pizza"></option>
          </datalist>
          <span class="invalid-feedback" *ngIf="orderForm.get('pizzaName')?.invalid && orderForm.get('pizzaName')?.touched">
            Pizza Name is required.
          </span>
        </div>

        <div class="form-row">
          <div class="form-group col">
            <label for="quantity">Quantity</label>
            <input 
              type="number" 
              id="quantity" 
              formControlName="quantity" 
              class="form-control" 
              min="1"
              (change)="updateBill()"
              [class.is-invalid]="orderForm.get('quantity')?.invalid && orderForm.get('quantity')?.touched">
            <span class="invalid-feedback" *ngIf="orderForm.get('quantity')?.errors?.['required'] && orderForm.get('quantity')?.touched">
              Quantity is required.
            </span>
            <span class="invalid-feedback" *ngIf="orderForm.get('quantity')?.errors?.['min'] && orderForm.get('quantity')?.touched">
              Quantity must be at least 1.
            </span>
          </div>

          <div class="form-group col">
            <label for="bill">Bill Amount ($)</label>
            <input 
              type="number" 
              id="bill" 
              formControlName="bill" 
              class="form-control" 
              step="0.01"
              [class.is-invalid]="orderForm.get('bill')?.invalid && orderForm.get('bill')?.touched">
            <span class="invalid-feedback" *ngIf="orderForm.get('bill')?.invalid && orderForm.get('bill')?.touched">
              Bill amount is required.
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="customerContactNumber">Contact Number</label>
          <input 
            type="text" 
            id="customerContactNumber" 
            formControlName="customerContactNumber" 
            class="form-control" 
            placeholder="10 digit number"
            [class.is-invalid]="orderForm.get('customerContactNumber')?.invalid && orderForm.get('customerContactNumber')?.touched">
          <span class="invalid-feedback" *ngIf="orderForm.get('customerContactNumber')?.errors?.['required'] && orderForm.get('customerContactNumber')?.touched">
            Contact Number is required.
          </span>
          <span class="invalid-feedback" *ngIf="orderForm.get('customerContactNumber')?.errors?.['pattern'] && orderForm.get('customerContactNumber')?.touched">
            Contact Number must be exactly 10 digits.
          </span>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting">Processing...</span>
          <span *ngIf="!isSubmitting">Place Order</span>
        </button>
      </form>
    </div>
  </div>
</div>
